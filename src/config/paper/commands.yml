package me.sxmoose202.untitled3;

import me.sxmoose202.untitled3.Crafting.CustomCrafting;
import me.sxmoose202.untitled3.Commands.EnergyCommand;
import me.sxmoose202.untitled3.Listeners.PlayerListener;
import me.sxmoose202.untitled3.Listeners.SparkListener;
import me.sxmoose202.untitled3.Managers.EnergyManager;
import me.sxmoose202.untitled3.Managers.SparkManager;
import me.sxmoose202.untitled3.Managers.EnchantManager;
import org.bukkit.plugin.java.JavaPlugin;

public class Untitled3 extends JavaPlugin {

    private static Untitled3 instance;
    private EnergyManager energyManager;
    private SparkManager sparkManager;

    @Override
    public void onEnable() {
        instance = this;

        energyManager = new EnergyManager();
        sparkManager = new SparkManager();

        // Register listeners
        getServer().getPluginManager().registerEvents(new PlayerListener(energyManager, sparkManager), this);
        getServer().getPluginManager().registerEvents(new SparkListener(sparkManager, energyManager), this);
        getServer().getPluginManager().registerEvents(new EnchantManager(), this);

        // Register commands
        getCommand("energy").setExecutor(new EnergyCommand(energyManager));

        // Register recipes
        new CustomCrafting().registerRecipes();

        getLogger().info("Untitled3 enabled!");
    }

    @Override
    public void onDisable() {
        getLogger().info("Untitled3 disabled!");
    }

    public static Untitled3 getInstance() {
        return instance;
    }

    public EnergyManager getEnergyManager() {
        return energyManager;
    }

    public SparkManager getSparkManager() {
        return sparkManager;
    }
}
package me.sxmoose202.untitled3.Managers;

import org.bukkit.event.Listener;
import org.bukkit.event.enchantment.EnchantItemEvent;
import org.bukkit.event.EventHandler;
import org.bukkit.enchantments.Enchantment;

public class EnchantManager implements Listener {

    @EventHandler
    public void onEnchant(EnchantItemEvent event) {
        // Only allow Protection III
        event.getEnchantsToAdd().keySet().removeIf(enchant -> !enchant.equals(Enchantment.PROTECTION_ENVIRONMENTAL));

        // Remove forbidden enchants
        event.getEnchantsToAdd().remove(Enchantment.FIRE_ASPECT);
        event.getEnchantsToAdd().remove(Enchantment.DAMAGE_ALL); // Strength/Sharpness
        event.getEnchantsToAdd().remove(Enchantment.THORNS);
    }
}
package me.sxmoose202.untitled3.Managers;

import org.bukkit.entity.Player;
import java.util.HashMap;
import java.util.Map;

public class EnergyManager {

    private Map<Player, Integer> energy = new HashMap<>();
    private final int START_ENERGY = 3;
    private final int MAX_ENERGY = 5;

    public void initPlayer(Player player) {
        energy.putIfAbsent(player, START_ENERGY);
    }

    public int getEnergy(Player player) {
        return energy.getOrDefault(player, START_ENERGY);
    }

    public void addEnergy(Player player, int amount) {
        int current = getEnergy(player) + amount;
        if (current > MAX_ENERGY) current = MAX_ENERGY;
        energy.put(player, current);
    }

    public void removeEnergy(Player player, int amount) {
        int current = getEnergy(player);
        if (current <= 1) return; // can't lose below 1
        current -= amount;
        if (current < 1) current = 1;
        energy.put(player, current);
    }
}
