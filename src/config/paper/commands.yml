package me.sxmoose202.untitled3.Commands;

import me.sxmoose202.untitled3.Managers.EnergyManager;
import org.bukkit.command.Command;
import org.bukkit.command.CommandExecutor;
import org.bukkit.command.CommandSender;
import org.bukkit.entity.Player;

public class EnergyCommand implements CommandExecutor {

    private EnergyManager manager;

    public EnergyCommand(EnergyManager manager) {
        this.manager = manager;
    }

    @Override
    public boolean onCommand(CommandSender sender, Command command, String label, String[] args) {
        if (!(sender instanceof Player)) {
            sender.sendMessage("Only players can use this command.");
            return true;
        }

        Player player = (Player) sender;
        player.sendMessage("§aYour energy: " + manager.getEnergy(player));
        return true;
    }
}
package me.sxmoose202.untitled3.Listeners;

import me.sxmoose202.untitled3.Managers.EnergyManager;
import me.sxmoose202.untitled3.Managers.SparkManager;
import org.bukkit.entity.Player;
import org.bukkit.event.Listener;
import org.bukkit.event.EventHandler;
import org.bukkit.event.entity.PlayerDeathEvent;
import org.bukkit.event.player.PlayerJoinEvent;

public class PlayerListener implements Listener {

    private EnergyManager energyManager;
    private SparkManager sparkManager;

    public PlayerListener(EnergyManager energyManager, SparkManager sparkManager) {
        this.energyManager = energyManager;
        this.sparkManager = sparkManager;
    }

    @EventHandler
    public void onJoin(PlayerJoinEvent event) {
        Player player = event.getPlayer();
        energyManager.initPlayer(player);
    }

    @EventHandler
    public void onDeath(PlayerDeathEvent event) {
        Player player = event.getEntity();
        energyManager.removeEnergy(player, 1);
        sparkManager.weakenSpark(player);
    }
}
package me.sxmoose202.untitled3.Listeners;

import me.sxmoose202.untitled3.Managers.EnergyManager;
import me.sxmoose202.untitled3.Managers.SparkManager;
import org.bukkit.entity.Player;
import org.bukkit.event.Listener;
import org.bukkit.event.entity.EntityDamageByEntityEvent;
import org.bukkit.event.EventHandler;

public class SparkListener implements Listener {

    private SparkManager sparkManager;
    private EnergyManager energyManager;
    private java.util.Map<Player, Integer> crits = new java.util.HashMap<>();

    public SparkListener(SparkManager sparkManager, EnergyManager energyManager) {
        this.sparkManager = sparkManager;
        this.energyManager = energyManager;
    }

    @EventHandler
    public void onCrit(EntityDamageByEntityEvent event) {
        if (!(event.getDamager() instanceof Player)) return;
        Player player = (Player) event.getDamager();

        // track crits
        crits.put(player, crits.getOrDefault(player, 0) + 1);
        if (crits.get(player) >= 5) {
            triggerSpark(player, event.getEntity());
            crits.put(player, 0);
        }
    }

    private void triggerSpark(Player player, org.bukkit.entity.Entity target) {
        String spark = sparkManager.getSpark(player);
        switch (spark) {
            case "Water":
                target.setFireTicks(0); // example placeholder for drowning effect
                player.sendMessage("§bWater Spark activated!");
                break;
            case "Flame":
                target.setFireTicks(100);
                player.sendMessage("§cFlame Spark activated!");
                break;
            case "Lightning":
                player.getWorld().strikeLightning(target.getLocation());
                player.sendMessage("§eLightning Spark activated!");
                break;
            case "Frost":
                // placeholder freezing
                player.sendMessage("§fFrost Spark activated!");
                break;
            case "Health":
                if (player.getHealth() < player.getMaxHealth() / 2) {
                    player.addPotionEffect(new org.bukkit.potion.PotionEffect(
                            org.bukkit.potion.PotionEffectType.DAMAGE_RESISTANCE, 200, 4));
                }
                player.sendMessage("§aHealth Spark activated!");
                break;
            case "Wealth":
                player.sendMessage("§6Wealth Spark activated!");
                break;
        }
    }
}
package me.sxmoose202.untitled3.Crafting;

import org.bukkit.Bukkit;
import org.bukkit.Material;
import org.bukkit.NamespacedKey;
import org.bukkit.inventory.ItemStack;
import org.bukkit.inventory.ShapedRecipe;
import org.bukkit.plugin.java.JavaPlugin;

public class CustomCrafting {

    public void registerRecipes() {
        JavaPlugin plugin = me.sxmoose202.untitled3.Untitled3.getInstance();

        // Golden apple: 1 Gold + 1 Apple
        ItemStack goldenApple = new ItemStack(Material.GOLDEN_APPLE, 1);
        ShapedRecipe recipe = new ShapedRecipe(new NamespacedKey(plugin, "custom_golden_apple"), goldenApple);
        recipe.shape(" G", " A");
        recipe.setIngredient('G', Material.GOLD_INGOT);
        recipe.setIngredient('A', Material.APPLE);
        Bukkit.addRecipe(recipe);
    }
}
